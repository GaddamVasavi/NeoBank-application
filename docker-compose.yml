version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: finverse-postgres
    environment:
      POSTGRES_DB: finverse_db
      POSTGRES_USER: finverse_user
      POSTGRES_PASSWORD: finverse_secret_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: finverse-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: finverse-kafka
    ports:
      - '9092:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: 'ci-finverse-kafka-cluster-id-01'

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finverse-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/finverse_db
      SPRING_DATASOURCE_USERNAME: finverse_user
      SPRING_DATASOURCE_PASSWORD: finverse_secret_password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - '8080:8080'
    depends_on:
      - postgres
      - redis
      - kafka

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finverse-frontend
    ports:
      - '80:80'
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
