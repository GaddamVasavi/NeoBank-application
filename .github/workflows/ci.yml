name: FinVerse CI / CD Pipeline
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build & Test Backend
        run: |
          cd backend
          mvn clean test
      - name: Build & Test Frontend
        run: |
          cd frontend
          npm install
          npm run test:run
          npm run build
