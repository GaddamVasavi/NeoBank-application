name: NeoBank Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-build:
    name: Backend Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Compile and Test Backend
        working-directory: ./backend
        run: mvn clean test --batch-mode
      - name: Package Application
        working-directory: ./backend
        run: mvn package -DskipTests --batch-mode

  frontend-build:
    name: Frontend Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Run Type Check & Lint
        working-directory: ./frontend
        run: npm run build
      - name: Run Frontend Tests
        working-directory: ./frontend
        run: npm run test:run
